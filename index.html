<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Man Camp Draft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0d; --bg2:#0e0e11; --card:#151517; --card2:#1a1a1e; --line:#2a2a2f; --line2:#37373d;
    --ink:#f3f3f4; --mute:#8c8c93; --dim:#5f5f66;
    --gold:#d9a94a; --gold2:#f0c778; --goldsoft:#2a2312;
    --tblue:#3f6fd6; --tred:#cf4436; --tgreen:#2fa25a; --tblack:#3a4048;
    --green:#3fbf7f; --red:#e05a4e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Barlow',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:80px;
    background:radial-gradient(120% 60% at 100% 0%, #16130c 0%, rgba(11,11,13,0) 55%), var(--bg)}
  .osw{font-family:'Oswald',sans-serif}
  svg{display:block}
  /* ---------- Motion ---------- */
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .anim-in{animation:fadeUp .30s cubic-bezier(.22,.61,.36,1) both}
  @keyframes dropIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .viewmenu.open{animation:dropIn .2s ease both}
  @keyframes fadeBg{from{opacity:0}to{opacity:1}}
  .overlay.show{animation:fadeBg .18s ease}
  @keyframes sheetDown{to{transform:translateY(40px);opacity:0}}
  @keyframes bgOut{to{opacity:0}}
  .sheet.closing{animation:sheetDown .2s ease forwards}
  .overlay.closing{animation:bgOut .2s ease forwards}
  .pcard,.chip,.rtab,.tcard,.set-row,.rt-r,.qrow,.team-block,.etag,.qbtn,.bbtn,.dbtn,.filterbtn,
  .nav button,.vm-item,.dndbtn,.qedit,.link,.gear,.stat,.rankbubble,.tag,.sw-opt,.q-handle button,.arrows button,.viewas{
    transition:background-color .18s ease,border-color .18s ease,color .18s ease,transform .16s ease,opacity .18s ease,box-shadow .18s ease}
  .pcard:active,.tcard:active,.set-row:active,.rt-r:active,.qrow:active{transform:scale(.99)}
  .chip:active,.qbtn:active,.bbtn:active,.dbtn:active,.etag:active,.rtab:active,.dndbtn:active,.filterbtn:active,.tag:active,.vm-item:active{transform:scale(.96)}
  .nav button:active{transform:scale(.9)}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.001ms !important;transition-duration:.001ms !important} }

  /* ---------- Header ---------- */
  .topbar{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#101012,#0b0b0d);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:11px;padding:12px 16px 10px}
  .brandlogo svg{width:38px;height:40px}
  .brandtitle{font-family:'Oswald',sans-serif;font-weight:700;font-size:19px;letter-spacing:1px}
  .brandtitle b{color:var(--gold)}
  .brandsub{font-size:11.5px;color:var(--mute);letter-spacing:.6px;margin-top:-1px}
  .gear{margin-left:auto;background:none;border:none;color:var(--gold);cursor:pointer;padding:4px}
  .gear svg{width:22px;height:22px}
  .viewas{display:flex;align-items:center;gap:10px;width:100%;background:#0e0e11;border:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:11px 16px;color:var(--ink);cursor:pointer;text-align:left;font-family:inherit}
  .viewas .vicon svg{width:17px;height:17px}
  .viewas .vtext{font-size:14px;font-weight:600}
  .viewas.locked{cursor:default}
  .viewas .vchev{margin-left:auto;color:var(--mute)}
  .viewas .vchev svg{width:16px;height:16px}
  .viewmenu{display:none;position:absolute;left:0;right:0;top:100%;z-index:60;background:#141417;border-bottom:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.6)}
  .viewmenu.open{display:block}
  .vm-group{padding:6px 0}
  .vm-lbl{font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--dim);padding:8px 16px 3px}
  .vm-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;font-size:14px;color:var(--ink)}
  .vm-item:hover{background:#1c1c20}
  .vm-item.sel{color:var(--gold)}
  .vm-item .sw{width:11px;height:11px;border-radius:3px;border:1px solid rgba(255,255,255,.25)}
  .vm-item .chk{margin-left:auto;color:var(--gold)}
  .vm-item .chk svg{width:16px;height:16px}

  /* ---------- Views ---------- */
  .view{padding:14px 16px 16px}
  .secrow{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
  h2.sec{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;letter-spacing:1.1px;text-transform:uppercase;color:var(--ink);margin:0}
  .link{font-size:12px;font-weight:700;letter-spacing:.4px;color:var(--gold);text-transform:uppercase;cursor:pointer}
  .rounds{font-size:12px;font-weight:600;letter-spacing:.5px;color:var(--mute);text-transform:uppercase;display:flex;align-items:center;gap:5px}
  .rounds svg{width:13px;height:13px}

  /* ---------- Crest ---------- */
  .crest{display:inline-block;vertical-align:middle}

  /* ---------- Banner ---------- */
  .banner{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#1b1b1f,#131316);border:1px solid var(--line2);border-radius:16px;padding:15px 16px;margin-top:14px}
  .banner .bcrest svg{width:46px;height:50px}
  .bmeta{display:flex;align-items:center;gap:8px;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:1px;color:var(--gold2);text-transform:uppercase}
  .gdot{width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(63,191,127,.22);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 2px rgba(63,191,127,.3)}70%{box-shadow:0 0 0 8px rgba(63,191,127,0)}100%{box-shadow:0 0 0 2px rgba(63,191,127,0)}}
  .btitle{font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;letter-spacing:.4px;line-height:1.05;margin-top:5px}
  .bbtns{display:flex;gap:11px;margin-top:12px}
  .bbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:transparent;border:1.5px solid var(--gold);color:var(--gold);
    border-radius:11px;padding:12px;font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;letter-spacing:.8px;text-transform:uppercase;cursor:pointer}
  .bbtn svg{width:16px;height:16px}
  .bbtn:active{background:rgba(217,169,74,.12)}

  /* ---------- Recent picks ---------- */
  .rpick{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px}
  .rp-rp{font-family:'Oswald',sans-serif;font-size:12px;color:var(--gold2);letter-spacing:.5px;min-width:44px}
  .rpick .crest svg{width:22px;height:24px}
  .rp-team{font-weight:600;font-size:14px}
  .rp-num{margin-left:auto;color:var(--dim);font-size:12px;font-weight:600}
  .rp-name{font-weight:600;font-size:14px;min-width:96px;text-align:right}

  /* ---------- Board grid ---------- */
  .board-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:14px;background:var(--card)}
  table.board{border-collapse:collapse;width:100%;font-size:11px}
  table.board th,table.board td{border:1px solid var(--line);padding:7px 8px;text-align:left;min-width:86px;vertical-align:top}
  table.board th{position:sticky;top:0;background:#1c1c20;font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.4px}
  table.board th.rd,table.board td.rd{min-width:30px;text-align:center;color:var(--mute);font-family:'Oswald',sans-serif;background:#141417}
  .thteam{display:flex;align-items:center;gap:6px}
  .thteam .crest svg{width:18px;height:20px}
  .thteam span{line-height:1.05}
  table.board td .pknum{color:var(--dim);font-size:10px;font-weight:700;font-family:'Oswald',sans-serif}
  table.board td .pkname{font-weight:600;color:var(--ink);font-size:11.5px;margin-top:1px}
  table.board td.empty .pknum{color:#42424a}
  table.board td.clock{background:rgba(217,169,74,.10);outline:2px solid var(--gold);outline-offset:-2px}
  table.board td.clock .oc{color:var(--gold);font-family:'Oswald',sans-serif;font-weight:600;font-size:10px;letter-spacing:.5px;margin-top:2px}

  /* ---------- Player cards ---------- */
  .controls{display:flex;gap:10px;margin-bottom:12px}
  .search{flex:1;display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 12px}
  .search svg{width:17px;height:17px;color:var(--mute);flex:none}
  .search input{flex:1;background:none;border:none;color:var(--ink);font-size:14px;font-family:inherit;padding:11px 0;outline:none}
  .filterbtn{width:46px;border:1px solid var(--line);background:var(--card);border-radius:12px;color:var(--mute);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .filterbtn svg{width:18px;height:18px}
  .chips{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;margin-bottom:12px}
  .chip{flex:none;background:var(--card);border:1px solid var(--line);color:var(--mute);border-radius:20px;padding:7px 14px;font-family:'Oswald',sans-serif;font-size:12px;font-weight:500;letter-spacing:.6px;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;gap:5px}
  .chip.on{background:var(--gold);border-color:var(--gold);color:#111;font-weight:600}
  .chip .ar{font-size:11px}

  .pcard{display:flex;align-items:flex-start;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:9px;cursor:pointer}
  .pnum{font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;color:var(--ink);min-width:26px;text-align:center;line-height:1.5}
  .pnum.flag{color:var(--red)}
  .pbody{flex:1;min-width:0}
  .prow1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pname{font-family:'Oswald',sans-serif;font-weight:600;font-size:16px;letter-spacing:.3px;text-transform:uppercase}
  .badge-ret{font-family:'Oswald',sans-serif;font-size:9.5px;font-weight:600;letter-spacing:.5px;color:var(--gold2);border:1px solid #4a3d1e;background:var(--goldsoft);border-radius:5px;padding:2px 6px;text-transform:uppercase}
  .warn{margin-left:auto;color:var(--red)}
  .warn svg{width:18px;height:18px}
  .pmeta{font-size:12.5px;color:var(--mute);margin-top:4px}
  .pfoot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
  .noteflag{display:inline-flex;align-items:center;gap:4px;color:var(--mute);font-size:11px}
  .noteflag svg{width:14px;height:14px}
  .ttag{font-family:'Oswald',sans-serif;font-size:10px;font-weight:500;letter-spacing:.5px;text-transform:uppercase;color:var(--mute);border:1px solid var(--line2);background:#101013;border-radius:6px;padding:3px 8px}
  .paction{align-self:center}
  .qbtn{background:transparent;border:1.5px solid var(--gold);color:var(--gold);border-radius:10px;padding:9px 13px;font-family:'Oswald',sans-serif;font-weight:600;font-size:12px;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
  .qbtn svg{width:14px;height:14px}
  .qbtn.queued{border-color:#4a3d1e;color:var(--gold2);cursor:default}
  .qbtn.draft{background:var(--gold);border-color:var(--gold);color:#111}
  .qtag{font-family:'Oswald',sans-serif;font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--gold2);display:flex;align-items:center;gap:6px}
  .qtag svg{width:15px;height:15px}
  .hint{font-size:12px;color:var(--mute);margin:2px 2px 10px}
  .empty{color:var(--dim);font-style:italic;font-size:13px;padding:26px 12px;text-align:center}
  /* ---------- Do Not Draft ---------- */
  .pcard.dnd{border-color:#7a2b26;background:linear-gradient(180deg,rgba(224,90,78,.09),rgba(224,90,78,.02))}
  .pcard.dnd .pname{color:#ef6a5e;text-decoration:line-through;text-decoration-color:rgba(239,106,94,.55);text-decoration-thickness:2px}
  .badge-dnd{display:inline-flex;align-items:center;gap:4px;font-family:'Oswald',sans-serif;font-size:9.5px;font-weight:600;letter-spacing:.6px;color:#fff;background:var(--red);border-radius:5px;padding:3px 7px;text-transform:uppercase}
  .badge-dnd svg{width:11px;height:11px}
  .dnd-name{color:#ef6a5e !important;text-decoration:line-through;text-decoration-color:rgba(239,106,94,.55);text-decoration-thickness:2px}
  .prospectrow{display:flex;gap:9px;margin:2px 0 20px}
  .gpbtn,.dndbtn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:transparent;border-radius:11px;padding:13px 10px;font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;letter-spacing:.6px;text-transform:uppercase;cursor:pointer}
  .gpbtn{border:1.5px solid var(--green);color:var(--green)}
  .gpbtn.on{background:var(--green);border-color:var(--green);color:#06231a}
  .dndbtn{border:1.5px solid var(--red);color:#ef6a5e}
  .dndbtn.on{background:var(--red);border-color:var(--red);color:#fff}
  .gpbtn svg,.dndbtn svg{width:16px;height:16px;flex:none}
  .pdot{width:11px;height:11px;border-radius:50%;flex:none}
  .pdot.gp{background:var(--green);box-shadow:0 0 0 3px rgba(63,191,127,.18)}
  .pdot.dnd{background:var(--red);box-shadow:0 0 0 3px rgba(224,90,78,.18)}
  .dbadge.gpb{color:#06231a;background:var(--green);border:1px solid var(--green);margin-left:6px;display:inline-flex;align-items:center;gap:5px}
  .dbadge.gpb svg{width:12px;height:12px}
  .dhead.dnd .dname{color:#ef6a5e;text-decoration:line-through;text-decoration-color:rgba(239,106,94,.5);text-decoration-thickness:2px}
  .dbadge.dndb{color:#fff;background:var(--red);border:1px solid var(--red);margin-left:6px;display:inline-flex;align-items:center;gap:5px}
  .dbadge.dndb svg{width:12px;height:12px}

  /* ---------- Rosters ---------- */
  .rtabs{display:flex;gap:20px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 -16px 14px;padding:0 16px}
  .rtab{flex:none;background:none;border:none;color:var(--mute);font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;padding:2px 0 11px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .rtab.on{color:var(--gold);border-bottom-color:var(--gold)}
  .tcard{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:13px;padding:14px;margin-bottom:11px;cursor:pointer}
  .tcard .crest svg{width:40px;height:44px}
  .tc-name{font-family:'Oswald',sans-serif;font-weight:700;font-size:19px;letter-spacing:.5px;text-transform:uppercase}
  .tc-coach{font-size:12px;color:var(--mute);letter-spacing:.3px;margin-top:2px}
  .tc-right{margin-left:auto;text-align:right;display:flex;align-items:center;gap:10px}
  .tc-count{font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;line-height:1}
  .tc-count small{display:block;font-size:9.5px;font-weight:500;letter-spacing:.6px;color:var(--mute);text-transform:uppercase;margin-top:2px}
  .tc-right svg{width:16px;height:16px;color:var(--dim)}
  .rd-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .rd-head .crest svg{width:40px;height:44px}
  .rd-title{font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;letter-spacing:.5px;text-transform:uppercase}
  .rd-sub{font-size:12px;color:var(--mute);letter-spacing:.4px}
  .rtable{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .rt-h,.rt-r{display:flex;align-items:center;padding:11px 14px;gap:10px}
  .rt-h{background:#1a1a1e;font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:.6px;color:var(--mute);text-transform:uppercase;border-bottom:1px solid var(--line)}
  .rt-r{border-bottom:1px solid #202024;cursor:pointer}
  .rt-r:last-child{border-bottom:none}
  .rt-num{width:26px;font-family:'Oswald',sans-serif;font-weight:700;color:var(--gold2)}
  .rt-name{flex:1;font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;letter-spacing:.3px;text-transform:uppercase;min-width:0;color:var(--gold)}
  .rt-pickh{width:62px;flex:none}
  .rt-pick{width:62px;flex:none;display:flex;flex-direction:column;line-height:1.05}
  .rt-ord{font-family:'Oswald',sans-serif;font-weight:700;font-size:17px;color:var(--gold)}
  .rt-ovr{font-size:9.5px;color:var(--dim);letter-spacing:.2px;margin-top:2px}
  .rt-ht,.rt-wt,.rt-age{width:52px;text-align:right;font-size:13px;color:var(--mute)}
  .rt-r .rt-chev{width:16px;text-align:right;color:var(--dim)}
  .rt-r .rt-chev svg{width:14px;height:14px}
  .rt-h .rt-ht,.rt-h .rt-wt,.rt-h .rt-age{color:var(--mute)}

  /* ---------- Queue ---------- */
  .qhead{display:flex;align-items:center;margin:8px 2px 14px}
  .qhead h2{font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;letter-spacing:.5px;text-transform:uppercase;margin:0}
  .qhead .qsub{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:1px;color:var(--mute);text-transform:uppercase;margin-top:2px}
  .qhead .qedit{margin-left:auto;background:none;border:none;color:var(--gold);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .qrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:9px}
  .qrow.gone{opacity:.4}
  .q-idx{font-family:'Oswald',sans-serif;font-weight:700;font-size:17px;color:var(--gold2);min-width:20px;text-align:center}
  .qrow .crest svg{width:30px;height:33px}
  .q-body{flex:1;min-width:0}
  .q-name{font-family:'Oswald',sans-serif;font-weight:600;font-size:15px;letter-spacing:.3px;text-transform:uppercase}
  .q-meta{font-size:12px;color:var(--mute);margin-top:1px}
  .q-dots{background:none;border:none;color:var(--mute);cursor:pointer;padding:4px}
  .q-dots svg{width:20px;height:20px}
  .q-x{background:none;border:none;color:var(--mute);cursor:pointer;padding:4px}
  .q-x svg{width:20px;height:20px}
  .q-handle{color:var(--dim);display:flex;flex-direction:column;gap:3px}
  .q-handle button{background:#202024;border:1px solid var(--line2);color:var(--ink);border-radius:5px;width:26px;height:19px;cursor:pointer;font-size:10px;line-height:1}
  .qfoot{font-size:12px;color:var(--dim);text-align:center;padding:8px 20px 4px;font-style:italic}
  .qclear{width:100%;background:var(--red);border:none;color:#fff;border-radius:12px;padding:14px;font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;letter-spacing:.8px;text-transform:uppercase;cursor:pointer;margin-top:8px}
  .qreorder{font-size:12px;color:var(--mute);text-align:center;margin-bottom:12px}

  /* ---------- Bottom nav ---------- */
  .nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:#0d0d10;border-top:1px solid var(--line);display:flex;z-index:50}
  .nav button{flex:1;background:none;border:none;color:var(--mute);padding:10px 4px 11px;font-family:'Oswald',sans-serif;font-size:10.5px;font-weight:500;letter-spacing:.7px;text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
  .nav button .ic svg{width:22px;height:22px;display:block}
  .nav button.on{color:var(--gold)}
  .nav .bdg{position:absolute;top:5px;left:50%;transform:translateX(4px);background:var(--red);color:#fff;font-size:9px;font-weight:700;border-radius:20px;padding:0 5px;font-family:'Barlow'}

  /* ---------- Sheet / detail ---------- */
  .overlay{position:fixed;inset:0;background:rgba(3,4,6,.72);z-index:70;display:none;align-items:flex-end;justify-content:center}
  .overlay.show{display:flex}
  .sheet{background:var(--bg2);width:100%;max-width:520px;border-radius:22px 22px 0 0;border-top:1px solid var(--line2);max-height:92vh;overflow-y:auto;animation:up .24s ease}
  @keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:translateY(0);opacity:1}}

function crest(teamId,cls){ const t=teamById(teamId); return `<span class="crest ${cls||''}"><svg viewBox="0 0 24 26">
  <defs><linearGradient id="g${t.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${t.color}"/><stop offset="1" stop-color="${shade(t.color,-28)}"/></linearGradient></defs>
  <path d="M12 1.4 21.4 4.5 V12 C21.4 17.7 17.1 21.9 12 24.2 C6.9 21.9 2.6 17.7 2.6 12 V4.5 Z" fill="url(#g${t.id})" stroke="rgba(255,255,255,.28)" stroke-width="0.7"/>

function shade(hex,amt){ let c=hex.replace('#',''); let r=parseInt(c.substr(0,2),16),g=parseInt(c.substr(2,2),16),b=parseInt(c.substr(4,2),16);
  r=Math.max(0,Math.min(255,r+amt));g=Math.max(0,Math.min(255,g+amt));b=Math.max(0,Math.min(255,b+amt));
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); }
const headerLogo=`<svg viewBox="0 0 24 26"><path d="M12 1.4 21.4 4.5 V12 C21.4 17.7 17.1 21.9 12 24.2 C6.9 21.9 2.6 17.7 2.6 12 V4.5 Z" fill="none" stroke="#d9a94a" stroke-width="1.3"/><path d="M8 12c1.4-1.7 6.6-1.7 8 0-1.4 1.7-6.6 1.7-8 0Z" fill="none" stroke="#d9a94a" stroke-width="1.2"/><path d="M10.4 12h3.2M12 10.8v2.4" stroke="#d9a94a" stroke-width="1"/></svg>`;

/* ================= HELPERS ================= */
const isCoach=()=>S.role==="head"||S.role==="assistant";
const canQueue=()=>S.role==="head";
const coachKey=()=>(S.role==="head"?"H":"A")+S.coachTeam;
const noteBag=()=>S.notes[coachKey()]||(S.notes[coachKey()]={});
const tagBag=()=>S.tags[coachKey()]||(S.tags[coachKey()]={});
const noteOf=id=>isCoach()?((S.notes[coachKey()]||{})[id]||""):"";
const tagsOf=id=>isCoach()?((S.tags[coachKey()]||{})[id]||[]):[];
const DND="DO NOT DRAFT";
const GP="GREAT PROSPECT";
const isDND=id=>tagsOf(id).includes(DND);
const isGP=id=>tagsOf(id).includes(GP);
function toggleProspect(pid,kind){ if(!isCoach())return;
  const b=tagBag(); let arr=b[pid]||(b[pid]=[]);
  const on=kind==="gp"?GP:DND, off=kind==="gp"?DND:GP, had=arr.includes(on);
  arr=arr.filter(t=>t!==on&&t!==off); if(!had)arr.push(on);   // mutually exclusive
  if(arr.length)b[pid]=arr; else delete b[pid]; openPlayer(pid); }
const inTeamQueue=id=>isCoach()&&S.queues[S.coachTeam].includes(id);
const picksMade=()=>PLAYERS.filter(p=>p.drafted).length;
const onClockTeamId=()=>{const i=picksMade();return i<ORDER.length?ORDER[i]:null;};
const draftDone=()=>picksMade()>=ORDER.length||PLAYERS.every(p=>p.drafted);
function roundInfo(i){i=(i==null?picksMade():i);return{rd:Math.floor(i/TEAMS.length)+1,pir:i%TEAMS.length+1};}
function fmtHt(h){return h?h.replace('-',"'")+'"':'—';}
function metaLine(p){return `${fmtHt(p.height)} • ${p.weight??'—'} lbs • Age ${p.age??'—'}`;}
function statsBlock(p){
  const s=p.stats; if(!s) return "";
  const L=[];
  if(s.rush_att) L.push(["Rushing",`${s.rush_att} att · ${s.rush_yds||0} yds · ${s.rush_td||0} TD`]);
  if(s.rec_rec)  L.push(["Receiving",`${s.rec_rec} rec · ${s.rec_yds||0} yds · ${s.rec_td||0} TD`]);
  if(s.pass_att) L.push(["Passing",`${s.pass_comp||0}/${s.pass_att} · ${s.pass_yds||0} yds · ${s.pass_td||0} TD · ${s.pass_int||0} INT`]);
  if(s.def_tkl||s.def_sack||s.def_int) L.push(["Defense",`${s.def_tkl||0} tkl · ${s.def_sack||0} sack · ${s.def_int||0} INT`]);
  if(!L.length) return "";
  const TW={Blue:"Blue Bulldogs",Red:"Red Raptors",Green:"Green Gators",Black:"Black Knights"};
  const TC={Blue:"#3f6fd6",Red:"#cf4436",Green:"#2fa25a",Black:"#5b6270"};
  const DF={JV:"JV",KF:"Know Fear",VAR:"Varsity",HB:"Headbuster",PW:"PeeWee"};
  const where=s.team?`<div class="statmeta"><span class="swatch" style="background:${TC[s.team]||'#888'}"></span>${TW[s.team]||s.team} · ${DF[p.level]||p.level}${s.games?` · ${s.games} game${s.games>1?'s':''}`:''}</div>`:'';
  return `<div class="dsec">2026 Season Stats</div>${where}
    <div class="statlines">${L.map(([k,v])=>`<div class="statline"><span class="sl-k">${k}</span><span class="sl-v">${v}</span></div>`).join("")}</div>`;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const $=id=>document.getElementById(id);

/* ================= ACTIONS ================= */
function assign(pid){ if(S.role!=="moderator")return toast("Only the moderator assigns picks");
  if(S.locked)return toast("Draft is locked");
  const tid=onClockTeamId(); if(tid==null)return toast("Draft complete");
  const p=PLAYERS.find(x=>x.id===pid); if(!p||p.drafted)return;
  p.drafted=true;p.teamId=tid;p.pickNo=++S.seq;
  TEAMS.forEach(t=>{S.queues[t.id]=S.queues[t.id].filter(x=>x!==pid);});
  toast(p.name+" → "+teamById(tid).name); render(); }
function autoPick(){ const tid=onClockTeamId(); if(tid==null)return;
  const q=S.queues[tid].filter(id=>!PLAYERS.find(p=>p.id===id).drafted); let pid=q[0];
  if(!pid){const a=sortedAvailable();pid=a[0]&&a[0].id;} if(pid)assign(pid); }
function reassignTeam(pid,tid){ if(S.role!=="moderator")return; const p=PLAYERS.find(x=>x.id===pid); if(!p||!p.drafted)return;
  p.teamId=+tid; toast(p.name+" moved to "+teamById(+tid).name); render(); }
function undoPick(pid){ if(S.role!=="moderator")return; const p=PLAYERS.find(x=>x.id===pid); if(!p||!p.drafted)return;
  p.drafted=false;p.teamId=null;p.pickNo=null; toast(p.name+" returned to the pool"); render(); }
function undoLast(){ const d=PLAYERS.filter(p=>p.drafted); if(!d.length)return; undoPick(d.sort((a,b)=>b.pickNo-a.pickNo)[0].id); }
function moveSeed(tid,dir){ const i=S.seed.indexOf(tid),j=i+dir; if(j<0||j>=S.seed.length)return;
  [S.seed[i],S.seed[j]]=[S.seed[j],S.seed[i]]; ORDER=buildOrder(S.seed); render(); openOrderEditor(); }
function toggleQueue(pid){ if(!canQueue())return toast("Only the head coach can edit the queue");
  const q=S.queues[S.coachTeam],i=q.indexOf(pid); if(i>=0){q.splice(i,1);toast("Removed from queue");}else{q.push(pid);toast("Added to queue");} render(); }
function moveQueue(pid,dir){ if(!canQueue())return; const q=S.queues[S.coachTeam],i=q.indexOf(pid),j=i+dir; if(j<0||j>=q.length)return;
  [q[i],q[j]]=[q[j],q[i]]; render(); }
function clearQueue(){ if(!canQueue())return; S.queues[S.coachTeam]=[]; S.queueEdit=false; toast("Queue cleared"); render(); }
function setNote(pid,text){ if(!isCoach())return; const b=noteBag(); if(text&&text.trim())b[pid]=text; else delete b[pid]; }
function toggleTag(pid,tag){ if(!isCoach())return; const b=tagBag(),arr=b[pid]||(b[pid]=[]),i=arr.indexOf(tag);
  if(i>=0)arr.splice(i,1); else arr.push(tag); if(arr.length===0)delete b[pid]; openPlayer(pid); }
function addCustomTag(pid){ if(!isCoach())return; const el=$("customTag"); if(!el)return; const t=el.value.trim().replace(/["'<>]/g,""); if(!t)return;
  let canon=S.tagVocab.find(v=>v.toLowerCase()===t.toLowerCase()); if(!canon){canon=t;S.tagVocab.push(canon);}
  const b=tagBag(),arr=b[pid]||(b[pid]=[]); if(!arr.includes(canon))arr.push(canon); openPlayer(pid); }

function sortedAvailable(){ let a=PLAYERS.filter(p=>!p.drafted);
  if(S.search){const s=S.search.toLowerCase();a=a.filter(p=>p.name.toLowerCase().includes(s));}
  const cmp={name:(x,y)=>x.last.localeCompare(y.last)||x.first.localeCompare(y.first),weight:(x,y)=>(x.weight||0)-(y.weight||0),
    age:(x,y)=>(x.age||0)-(y.age||0),height:(x,y)=>(x.hIn||0)-(y.hIn||0),exp:(x,y)=>(x.campExp||0)-(y.campExp||0),
    forty:(x,y)=>(x.forty??999)-(y.forty??999)};
  a.sort(cmp[S.sort]||cmp.name); if(S.sortDir==="desc")a.reverse(); return a; }
function setSort(k){ if(S.sort===k){S.sortDir=S.sortDir==="asc"?"desc":"asc";} else {S.sort=k;S.sortDir=(k==="name"||k==="forty")?"asc":"desc";} render(); animateIn($("plist")); }

/* ================= VIEW-AS ================= */
function viewLabel(){ if(S.role==="moderator")return "View as Moderator";
  return "View as "+(S.role==="head"?"Head Coach":"Assistant Coach")+" — "+teamById(S.coachTeam).name; }
function viewColor(){ return S.role==="moderator"?"var(--gold)":teamById(S.coachTeam).color; }
function toggleViewMenu(e){ if(LOCK_ROLE) return; if(e)e.stopPropagation(); S.viewMenu=!S.viewMenu; $("viewmenu").classList.toggle("open",S.viewMenu); }
function setRoleTeam(role,team){ S.role=role; if(team)S.coachTeam=team; S.viewMenu=false;
  if(!isCoach()&&S.view==="queue")S.view="board"; if(S.view==="rosters")S.rosterTeam=null; render(); }

  h+=`<div class="vm-group"><div class="vm-lbl">Head Coach</div>`+TEAMS.map(t=>`<div class="vm-item ${S.role==='head'&&S.coachTeam===t.id?'sel':''}" onclick="setRoleTeam('head',${t.id})"><span class="sw" style="background:${t.color}"></span>${t.name} ${S.role==='head'&&S.coachTeam===t.id?`<span class="chk">${I.check}</span>`:''}</div>`).join("")+`</div>`;
  h+=`<div class="vm-group"><div class="vm-lbl">Assistant Coach</div>`+TEAMS.map(t=>`<div class="vm-item ${S.role==='assistant'&&S.coachTeam===t.id?'sel':''}" onclick="setRoleTeam('assistant',${t.id})"><span class="sw" style="background:${t.color}"></span>${t.name} ${S.role==='assistant'&&S.coachTeam===t.id?`<span class="chk">${I.check}</span>`:''}</div>`).join("")+`</div>`;

/* ================= RENDER ================= */
function render(){
  $("brandlogo").innerHTML=headerLogo; $("gearBtn").innerHTML=I.gear; $("brandsub").textContent=divName()+" • 2026";
  $("vicon").innerHTML=`<span style="color:${viewColor()}">${I.person}</span>`;
  $("vtext").textContent=viewLabel();
  $("vchev").innerHTML=LOCK_ROLE?"":I.chevD;
  $("viewas").classList.toggle("locked",LOCK_ROLE);
  $("viewmenu").classList.toggle("open",S.viewMenu); renderViewMenu();
  renderNav();
  const v=S.view;
  if(v==="board")renderBoard(); else if(v==="players")renderPlayers(); else if(v==="queue")renderQueue(); else if(v==="rosters")renderRosters();
  const sig=v+"|"+S.divKey+"|"+S.rosterTeam;   // fade only when the view/division/roster level actually changes
  if(sig!==_viewSig) animateIn($("view"));

}
let _viewSig=null;
function animateIn(el){ if(!el)return; el.classList.remove("anim-in"); void el.offsetWidth; el.classList.add("anim-in"); }
function renderNav(){
  const tabs=[["board","Board",I.nBoard],["players","Players",I.nPlayers],["queue","Queue",I.nQueue],["rosters","Rosters",I.nRosters]];
  let qbadge=0; if(isCoach())qbadge=S.queues[S.coachTeam].filter(id=>!PLAYERS.find(p=>p.id===id).drafted).length;
  $("nav").innerHTML=tabs.map(([k,lbl,ic])=>`<button class="${S.view===k?'on':''}" onclick="go('${k}')"><span class="ic">${ic}</span>${lbl}${k==='queue'&&qbadge?`<span class="bdg">${qbadge}</span>`:''}</button>`).join("");
}
function go(v){ S.view=v; if(v==="rosters")S.rosterTeam=null; if(v==="queue")S.queueEdit=false; render(); }

/* ---- BOARD ---- */
function renderBoard(){
  const done=draftDone(), clockTid=onClockTeamId(), t=clockTid?teamById(clockTid):null, {rd,pir}=roundInfo();
  let h="";
  // banner
  if(done){
    h+=`<div class="banner"><div class="bcrest">${headerLogo}</div><div class="bmain"><div class="bmeta"><span class="gdot" style="background:var(--gold);animation:none;box-shadow:none"></span> DRAFT COMPLETE</div><div class="btitle">ALL ${picksMade()} CAMPERS PLACED</div></div></div>`;
  }else{
    h+=`<div class="banner"><div class="bcrest">${crest(clockTid)}</div><div class="bmain">
      <div class="bmeta"><span class="gdot"></span> ROUND ${rd} • PICK ${pir} • ${picksMade()+1} OF ${PLAYERS.length}</div>
      <div class="btitle">${t.name.toUpperCase()} ON THE CLOCK</div></div></div>`;
    if(S.role==="moderator"&&picksMade()>0) h+=`<div class="bbtns"><button class="bbtn" onclick="undoLast()">${I.undo} Undo Last</button></div>`;
  }
  // recent picks
  const picks=PLAYERS.filter(p=>p.drafted).sort((a,b)=>b.pickNo-a.pickNo).slice(0,4);
  h+=`<div class="secrow"><h2 class="sec">Recent Picks</h2>${S.role==="moderator"?`<span class="link" onclick="openOrderEditor()">Edit Order</span>`:`<span class="link" onclick="go('rosters')">View All</span>`}</div>`;
  if(!picks.length) h+=`<div class="empty">No picks yet — the board fills in live as the moderator assigns each camper.</div>`;
  else h+=picks.map(p=>{const tm=teamById(p.teamId),ri=roundInfo(p.pickNo-1);
    return `<div class="rpick"><span class="rp-rp">R${ri.rd} • P${ri.pir}</span>${crest(p.teamId)}<span class="rp-team">${tm.name}</span><span class="rp-num">#${p.pickNo}</span><span class="rp-name">${p.first[0]}. ${p.last}</span></div>`;}).join("");
  // board grid
  h+=`<div class="secrow"><h2 class="sec">Draft Board</h2><span class="rounds">Rounds ${I.chevD}</span></div>`;
  const teamPicks={}; TEAMS.forEach(tm=>teamPicks[tm.id]=PLAYERS.filter(p=>p.teamId===tm.id).sort((a,b)=>a.pickNo-b.pickNo));
  const clockRow=clockTid!=null?teamPicks[clockTid].length:-1;
  h+=`<div class="board-wrap"><table class="board"><tr><th class="rd">RD</th>`+
     TEAMS.map(tm=>`<th><div class="thteam">${crest(tm.id)}<span>${tm.two[0]}<br>${tm.two[1]}</span></div></th>`).join("")+`</tr>`;
  for(let r=0;r<ROUNDS;r++){
    h+=`<tr><td class="rd">${r+1}</td>`;
    TEAMS.forEach(tm=>{
      const seq=r%2===0?S.seed:[...S.seed].reverse(); const overall=r*TEAMS.length+seq.indexOf(tm.id)+1;
      const p=teamPicks[tm.id][r]; const isClock=tm.id===clockTid&&r===clockRow&&!done;
      if(p) h+=`<td class="filled" onclick="openPlayer(${p.id})"><div class="pknum">#${overall}</div><div class="pkname">${p.last}</div></td>`;
      else if(isClock) h+=`<td class="empty clock"><div class="pknum">#${overall}</div><div class="oc">ON THE CLOCK</div></td>`;
      else h+=`<td class="empty"><div class="pknum">#${overall}</div></td>`;
    });
    h+=`</tr>`;
  }
  h+=`</table></div><div class="hint">Snake order · ${TEAMS.length} teams · ${ROUNDS} rounds · scroll sideways to see all teams</div>`;
  $("view").innerHTML=h;
}
function openOrderEditor(){ if(S.role!=="moderator")return;
  const rows=S.seed.map((tid,i)=>{const t=teamById(tid);return `<div class="qrow"><span class="q-idx">${i+1}</span>${crest(tid)}<div class="q-body"><div class="q-name">${t.name}</div></div><div class="q-handle"><button onclick="moveSeed(${tid},-1)">▲</button><button onclick="moveSeed(${tid},1)">▼</button></div></div>`;}).join("");
  $("sheet").innerHTML=`<div class="sh-top"><button class="ic" onclick="closeSheet()">${I.x}</button></div><div class="sh-body"><div class="dname" style="font-size:24px;margin-bottom:6px">DRAFT ORDER</div><div class="dsub" style="margin-bottom:16px">Round 1 order — the snake reverses each round. Picks already made stay put.</div>${rows}<div class="dactions" style="margin-top:14px"><button class="dbtn" onclick="closeSheet()">Done</button></div></div>`;
  showSheet();
}

/* ---- PLAYERS ---- */
function renderPlayerList(){
  const list=sortedAvailable();
  const el=$("plist"); if(!el) return;
  el.innerHTML = list.length ? list.map(p=>playerCard(p)).join("") : `<div class="empty">No campers match “${escapeHtml(S.search)}”.</div>`;
}
function renderPlayers(){
  const has40=PLAYERS.some(p=>p.forty);
  if(S.sort==="forty"&&!has40) S.sort="name";
  const sorts=[["name","Name"],["age","Age"],["height","Height"],["weight","Weight"]];
  if(has40) sorts.push(["forty","40 Time"]);
  sorts.push(["exp","Experience"]);
  let h=`<div class="controls"><div class="search">${I.search}<input id="searchBox" placeholder="Search players…" value="${escapeHtml(S.search)}"></div></div>`;
  h+=`<div class="chips">`+sorts.map(([k,l])=>`<button class="chip ${S.sort===k?'on':''}" onclick="setSort('${k}')">${l}${S.sort===k?` <span class="ar">${S.sortDir==='asc'?'↑':'↓'}</span>`:''}</button>`).join("")+`</div>`;
  h+=`<div id="plist"></div>`;
  $("view").innerHTML=h;
  renderPlayerList();
  const sb=$("searchBox");
  sb.oninput=e=>{ S.search=e.target.value; renderPlayerList(); };  // only re-render the list, keep the input focused
}
function playerCard(p){
  const dnd=isDND(p.id), gp=isGP(p.id), tags=tagsOf(p.id).filter(t=>t!==DND&&t!==GP).slice(0,3), note=noteOf(p.id);
  let action="";
  if(S.role==="moderator"&&!draftDone()&&!S.locked) action=`<button class="qbtn draft" onclick="event.stopPropagation();assign(${p.id})">Draft</button>`;

/* ---- QUEUE ---- */
function renderQueue(){
  if(!isCoach()){ $("view").innerHTML=`<div class="empty">The queue is a coach tool. Switch to a coach view to build a team's draft queue.</div>`; return; }
  const t=teamById(S.coachTeam), editable=canQueue(); const q=S.queues[S.coachTeam].map(id=>PLAYERS.find(p=>p.id===id));
  const live=q.filter(p=>!p.drafted).length;
  let h=`<div class="qhead"><div><h2>${editable?'MY QUEUE':'TEAM QUEUE'}</h2><div class="qsub">${live} Target${live!==1?'s':''}${editable?'':' · view only'}</div></div>${editable&&q.length?`<button class="qedit" onclick="S.queueEdit=!S.queueEdit;render()">${S.queueEdit?'Done':'Edit'}</button>`:''}</div>`;
  if(S.queueEdit) h+=`<div class="qreorder">Reorder with the arrows · tap ✕ to remove</div>`;
  if(!q.length){ h+=`<div class="empty">Queue is empty.${editable?" Go to Players and tap ＋ Queue on the boys you're targeting.":" Your head coach hasn't added anyone yet."}</div>`; }
  else{
    q.forEach((p,i)=>{
      const gone=p.drafted;
      h+=`<div class="qrow ${gone?'gone':''}"><span class="q-idx">${i+1}</span>${crest(p.teamId||S.coachTeam)}<div class="q-body" onclick="openPlayer(${p.id})"><div class="q-name ${isDND(p.id)?'dnd-name':''}">${p.name}</div><div class="q-meta">${fmtHt(p.height)} • ${p.weight??'—'} lb • ${p.age??'—'} yrs${gone?` · drafted by ${teamById(p.teamId).name}`:''}</div></div>`;
      if(editable&&S.queueEdit&&!gone) h+=`<div class="q-handle"><button onclick="moveQueue(${p.id},-1)">▲</button><button onclick="moveQueue(${p.id},1)">▼</button></div><button class="q-x" onclick="toggleQueue(${p.id})">${I.x}</button>`;
      else if(editable&&gone) h+=`<button class="q-x" onclick="toggleQueue(${p.id})">${I.x}</button>`;
      else if(editable) h+=`<button class="q-dots" onclick="openPlayer(${p.id})">${I.dots}</button>`;
      h+=`</div>`;
    });
    if(S.queueEdit) h+=`<button class="qclear" onclick="clearQueue()">Clear Queue</button>`;
    else h+=`<div class="qfoot">Drafted players automatically remove from your queue.</div>`;

}

/* ---- PLAYER DETAIL ---- */
function openPlayer(pid){
  const p=PLAYERS.find(x=>x.id===pid);
  const drafted=p.drafted, tm=drafted?teamById(p.teamId):null, dnd=isDND(p.id), gp=isGP(p.id);
  const badge=drafted?`<span class="dbadge dr">Drafted #${p.pickNo} · ${tm.name}</span>`:`<span class="dbadge av">Available</span>`;
  // history — only shown when we have verified year-by-year data on file
  const histHtml=(p.history&&p.history.length)
    ? `<div class="dsec">History</div><div class="hist">`+p.history.map(h=>`<div class="hist-row"><span class="hist-yr">${h.year}</span><span class="hist-what">${escapeHtml(h.what)}</span></div>`).join("")+`</div>`
    : "";
  // stat tiles (40 time & varsity years shown only when present)
  const tiles=[["Height",fmtHt(p.height)],["Weight (lb)",p.weight??'—'],["Age",p.age??'—']];
  if(p.forty) tiles.push(["40 Time",p.forty+"s"]);
  tiles.push(["Push-ups",p.pushups??'—'],["Sit-ups",p.situps??'—'],["Camp Yrs",p.campExp??0]);
  if(p.varsityExp>0) tiles.push(["Varsity Yrs",p.varsityExp]);
  const gridHtml=tiles.map(([k,v])=>`<div class="stat"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("");
  // coach tools
  let coachTools="";
  if(isCoach()){
    const note=noteOf(p.id), mine=tagsOf(p.id);
    const chips=S.tagVocab.map(tag=>`<span class="etag ${mine.includes(tag)?'on':''}" onclick="toggleTag(${p.id},'${tag.replace(/'/g,"\\'")}')">${escapeHtml(tag)}</span>`).join("");
    coachTools=`<div class="dsec">Evaluation — your tags</div><div class="tagwrap">${chips}</div>
      <div class="addtag"><input id="customTag" placeholder="Add a trait…" onkeydown="if(event.key==='Enter')addCustomTag(${p.id})"><button onclick="addCustomTag(${p.id})">Add</button></div>
      <div class="prospectrow">
        <button class="gpbtn ${gp?'on':''}" onclick="toggleProspect(${p.id},'gp')">${I.check} ${gp?'Great Prospect ✓':'Great Prospect'}</button>
        <button class="dndbtn ${dnd?'on':''}" onclick="toggleProspect(${p.id},'dnd')">${I.ban} ${dnd?'Do Not Draft ✓':'Do Not Draft'}</button>
      </div>
      <div class="dsec">Private notes</div><div class="notebox"><textarea class="note" placeholder="e.g. strong blocker, coachable, plays bigger than his size…" oninput="setNote(${p.id},this.value)">${escapeHtml(note)}</textarea></div>`;
  }
  // actions
  let actions="";
  if(S.role==="moderator"){
    if(!drafted&&!draftDone()&&!S.locked) actions=`<div class="dactions"><button class="dbtn" onclick="assign(${p.id});closeSheet()">Draft to ${teamById(onClockTeamId()).name}</button></div>`;
    else if(drafted) actions=`<div class="posrow"><label>Reassign to team — fix a wrong pick</label><select class="possel" onchange="reassignTeam(${p.id},this.value)">${TEAMS.map(t=>`<option value="${t.id}" ${t.id===p.teamId?'selected':''}>${t.name}</option>`).join("")}</select></div><div class="dactions"><button class="dbtn danger" onclick="undoPick(${p.id});closeSheet()">Return ${p.first} to Pool</button></div>`;
  } else if(canQueue()&&!drafted){
    const on=inTeamQueue(p.id);
    actions=`<div class="dactions"><button class="dbtn ${on?'ghost':''}" onclick="toggleQueue(${p.id});closeSheet()">${on?'Remove from Queue':'Add to Queue'}</button></div>`;
  }
  $("sheet").innerHTML=`
    <div class="sh-top"><button class="ic" onclick="closeSheet()">${I.back}</button></div>
    <div class="sh-body">
      <div class="dhead ${dnd?'dnd':''}"><div><div class="dname">${p.name}</div>${badge}${gp?`<span class="dbadge gpb">${I.check} Great Prospect</span>`:''}${dnd?`<span class="dbadge dndb">${I.ban} Do Not Draft</span>`:''}<div class="dsub">${p.campExp} yr${p.campExp!==1?'s':''} camp · ${p.level==='PW'?'PeeWee':p.level} · ${p.age??'—'} yrs old</div></div>${crest(drafted?p.teamId:S.coachTeam)}</div>
      ${p.flag?`<div class="warnrow">${I.warn}<span>${p.flag} — worth confirming in the source sheet.</span></div>`:''}
      <div class="statgrid">${gridHtml}</div>
      ${statsBlock(p)}
      ${coachTools}
      ${histHtml}
      ${actions}
    </div>`;
  showSheet();
}
let _sheetT=null;
function showSheet(){ clearTimeout(_sheetT); const ov=$("overlay"),sh=$("sheet"); sh.classList.remove("closing"); ov.classList.remove("closing"); ov.classList.add("show"); }
function closeSheet(){ const ov=$("overlay"),sh=$("sheet"); if(!ov.classList.contains("show"))return;
  sh.classList.add("closing"); ov.classList.add("closing"); clearTimeout(_sheetT);
  _sheetT=setTimeout(()=>{ ov.classList.remove("show","closing"); sh.classList.remove("settings","closing"); S.setPage=null; render(); },200); }

const DIVISIONS=[
  {key:"PW",name:"PeeWee",band:"Ages 8–10"},
  {key:"HB",name:"Headbuster",band:"Ages 11–12"},
  {key:"KF",name:"Know Fear League",band:"Ages 13–14"},
  {key:"JV",name:"Junior Varsity",band:"Ages 15–16"},
  {key:"VAR",name:"Varsity",band:"Ages 17–18"}
];
const divName=()=>DIVISIONS.find(d=>d.key===S.divKey).name;
const DIV_STATE={};
const FN=["Aiden","Blake","Caleb","Dawson","Eli","Gabe","Hudson","Isaac","Jonah","Kade","Levi","Micah","Nathan","Owen","Parker","Reid","Silas","Titus","Wyatt","Josiah","Grant","Colton","Bennett","Emmett","Rhett","Tate","Brooks","Ryder","Zane","Cole"];
const LN=["Adams","Boone","Carver","Dalton","Ellis","Foster","Grant","Hayes","Ingram","Jennings","Keller","Lawson","Mercer","Norris","Owens","Porter","Reeves","Sutton","Turner","Vance","Walsh","York","Bishop","Chandler","Dixon","Fowler","Hobbs","Landry","Mason","Pruitt"];
function genDivisionPlayers(key){
  const idx=DIVISIONS.findIndex(d=>d.key===key), base=idx*1000;
  const raw=(typeof DIVDATA!=="undefined" && DIVDATA[key])||[];
  return raw.map((p,i)=>({
    id:base+i+1, first:(p.f||"").trim(), last:(p.l||"").trim(), name:((p.f||"")+" "+(p.l||"")).trim(),
    height:p.h||null, weight:(p.w??null), pushups:(p.pu??null), situps:(p.su??null),
    age:(p.a??null), campExp:(p.ce||0), varsityExp:(p.ve||0), level:key,
    forty:(p.ft??null), stats:(p.st||null), hIn:heightInches(p.h),
    flag:(p.fl||null), drafted:false, teamId:null, pickNo:null
  }));
}
function recomputeRanks(){ [...PLAYERS].sort((a,b)=>(b.weight||0)-(a.weight||0)).forEach((p,i)=>p.rank=i+1); }
function snapshotDivision(){ DIV_STATE[S.divKey]={players:PLAYERS.map(p=>({...p})),queues:JSON.parse(JSON.stringify(S.queues)),notes:JSON.parse(JSON.stringify(S.notes)),tags:JSON.parse(JSON.stringify(S.tags)),seed:[...S.seed],seq:S.seq,locked:S.locked}; }
function loadDivision(key){
  if(key===S.divKey){ setPage("main"); return; }
  snapshotDivision(); S.divKey=key; const st=DIV_STATE[key];
  const src=st?st.players:genDivisionPlayers(key);
  PLAYERS.length=0; src.forEach(p=>PLAYERS.push(p)); recomputeRanks();
  if(st){ S.queues=st.queues; S.notes=st.notes; S.tags=st.tags; S.seed=st.seed; S.seq=st.seq; S.locked=st.locked; }
  else { S.queues={}; TEAMS.forEach(t=>S.queues[t.id]=[]); S.notes={}; S.tags={}; S.seed=TEAMS.map(t=>t.id); S.seq=0; S.locked=false; }
  ORDER=buildOrder(S.seed); S.rosterTeam=null; S.view="board"; S.viewMenu=false; toast("Switched to "+divName()); closeSheet();
}

function setTeamName(id,v){ const t=teamById(id); t.name=v||"Team"; const w=t.name.trim().split(/\s+/);
  t.short=w[w.length-1]; t.two=w.length>1?[w.slice(0,-1).join(" "),w[w.length-1]]:[t.name," "]; t.initial=(t.name[0]||"?").toUpperCase(); }

function exportCSV(){
  const rows=[["Division","Team","Pick","First","Last","Height","Weight","Age","Pushups","Situps","CampYears"]];
  TEAMS.forEach(t=>{ PLAYERS.filter(p=>p.teamId===t.id).sort((a,b)=>a.pickNo-b.pickNo).forEach(p=>{
    rows.push([divName(),t.name,p.pickNo,p.first,p.last,p.height||"",p.weight??"",p.age??"",p.pushups??"",p.situps??"",p.campExp]); }); });
  if(rows.length===1) return toast("No picks to export yet");
  const csv=rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n");
  const url=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  const a=document.createElement("a"); a.href=url; a.download=`mancamp-${S.divKey}-rosters.csv`; a.click(); URL.revokeObjectURL(url); toast("Roster CSV exported");
}
function saveFix(id){ const p=PLAYERS.find(x=>x.id===id);

  p.hIn=heightInches(p.height); p.flag=null; recomputeRanks(); toast(p.name+" updated"); renderSettings(); }

  const fl=PLAYERS.filter(p=>p.flag);
  if(!fl.length) return `<div class="empty">No flagged data — all clean.</div>`;
  return `<div class="hint" style="margin:0 2px 12px">These rows look like typos from the source sheet. Fix and save to clear the flag.</div>`+
    fl.map(p=>`<div class="teamedit"><div style="font-family:'Oswald';font-weight:600;font-size:16px;text-transform:uppercase">${p.name}</div>
      <div style="font-size:12px;color:var(--gold2);margin:4px 0 6px">${p.flag}</div>
      <div style="display:flex;gap:8px"><div style="flex:1"><div class="lbl">Height</div><input class="set-in" id="fix-h-${p.id}" value="${p.height||''}"></div>
      <div style="flex:1"><div class="lbl">Weight</div><input class="set-in" id="fix-w-${p.id}" value="${p.weight??''}"></div>
      <div style="flex:1"><div class="lbl">Age</div><input class="set-in" id="fix-a-${p.id}" value="${p.age??''}"></div></div>
      <button class="dbtn" style="width:100%;margin-top:12px" onclick="saveFix(${p.id})">Save</button></div>`).join("");
}
function pageNotif(){
  const items=[["clock","Your team is on the clock"],["start","Draft has started"],["pick","A pick was made"]];
  return `<div class="hint" style="margin:0 2px 12px">Choose when the app pings you during a live draft.</div>`+
    items.map(([k,l])=>`<div class="set-row" onclick="toggleNotif('${k}')"><span class="sl">${l}</span><span class="sv"><span class="toggle ${S.notif[k]?'on':''}"><span class="knob"></span></span></span></div>`).join("");
}
function pageAccount(){
  const who=S.role==="moderator"?"Moderator":(S.role==="head"?"Head Coach — "+teamById(S.coachTeam).name:"Assistant Coach — "+teamById(S.coachTeam).name);
  return `<div class="teamedit"><div class="lbl">Signed in as</div><div style="font-family:'Oswald';font-weight:600;font-size:18px;margin-top:4px">${who}</div>
    <div class="lbl" style="margin-top:12px">Division</div><div style="margin-top:4px">${divName()}</div></div>
    <button class="dbtn danger" style="width:100%" onclick="toast('Sign-out is wired in the full app')">Sign out</button>
    <div class="hint" style="margin-top:12px">In the live app your role is set by your login and can't be changed here.</div>`;
}
function pageHelp(){ return `<div class="set-content"><p><b>Man Camp Draft</b> — prototype v1.</p><p>A drafting tool for the Midwest Christian Boys Football Camp: run a live, fair draft, build rosters, and track players across every division.</p><p>Questions or issues? Contact the camp office.</p><p style="color:var(--mute)">© Man Camp · First Baptist Church, Dwight IL</p></div>`; }
function renderSettings(){
  const back=S.setPage==="main"?"closeSheet()":"setPage('main')";
  const titles={main:"Settings",division:"Division",teams:"Teams & Coaches",controls:"Draft Controls",data:"Fix Flagged Data",notif:"Notifications",account:"Account",help:"About",rules:"Draft Rules",policies:"Camp Policies",conduct:"Code of Conduct",expect:"Coaching Expectations"};
  const P=S.setPage; let body;
  if(P==="main")body=settingsMain(); else if(P==="division")body=pageDivision(); else if(P==="teams")body=pageTeams();
  else if(P==="controls")body=pageControls(); else if(P==="data")body=pageData(); else if(P==="notif")body=pageNotif();
  else if(P==="account")body=pageAccount(); else if(P==="help")body=pageHelp(); else body=`<div class="set-content">${CONTENT[P]||""}</div>`;
  $("sheet").innerHTML=`<div class="sh-top"><button class="ic" onclick="${back}">${I.back}</button></div>
    <div class="set-page"><div class="set-head"><div class="ttl">${titles[P]||"Settings"}</div></div>${body}</div>`;
  $("sheet").classList.add("settings"); showSheet();
}

/* ================= MISC ================= */
let toastT; function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),1400);}
$("overlay").addEventListener("click",e=>{if(e.target.id==="overlay")closeSheet();});
document.addEventListener("click",e=>{ if(S.viewMenu && !e.target.closest("#viewmenu") && !e.target.closest("#viewas")){ S.viewMenu=false; $("viewmenu").classList.remove("open"); }});
render();
</script>
</body>
</html>
